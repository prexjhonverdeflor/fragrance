<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── FadingVideo ─────────────────────────────────────────────────────────── */
function FadingVideo({ src, className, style }) {
  const videoRef = useRef(null);
  const rafRef = useRef(null);
  const fadingOutRef = useRef(false);
  const FADE_MS = 500, FADE_OUT_LEAD = 0.55;

  const fadeTo = useCallback((target, duration) => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const video = videoRef.current; if (!video) return;
    const start = performance.now();
    const startOpacity = parseFloat(video.style.opacity) || 0;
    function step(now) {
      const progress = Math.min((now - start) / duration, 1);
      video.style.opacity = startOpacity + (target - startOpacity) * progress;
      if (progress < 1) rafRef.current = requestAnimationFrame(step);
    }
    rafRef.current = requestAnimationFrame(step);
  }, []);

  useEffect(() => {
    const video = videoRef.current; if (!video) return;
    video.style.opacity = 0;
    const onLoadedData = () => { video.style.opacity = 0; video.play().catch(()=>{}); fadeTo(1, FADE_MS); };
    const onTimeUpdate = () => {
      if (!fadingOutRef.current && video.duration > 0) {
        const remaining = video.duration - video.currentTime;
        if (remaining <= FADE_OUT_LEAD && remaining > 0) { fadingOutRef.current = true; fadeTo(0, FADE_MS); }
      }
    };
    const onEnded = () => {
      video.style.opacity = 0;
      setTimeout(() => { video.currentTime = 0; video.play().catch(()=>{}); fadingOutRef.current = false; fadeTo(1, FADE_MS); }, 100);
    };
    video.addEventListener("loadeddata", onLoadedData);
    video.addEventListener("timeupdate", onTimeUpdate);
    video.addEventListener("ended", onEnded);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      video.removeEventListener("loadeddata", onLoadedData);
      video.removeEventListener("timeupdate", onTimeUpdate);
      video.removeEventListener("ended", onEnded);
    };
  }, [fadeTo]);

  return <video ref={videoRef} src={src} autoPlay muted playsInline preload="auto" className={className} style={{ opacity: 0, ...style }} />;
}

/* ── Icons ───────────────────────────────────────────────────────────────── */

    <path d="M12 5v14M5 12h14"/>
  </svg>
);

/* ── BlurText ────────────────────────────────────────────────────────────── */
function BlurText({ text, className }) {
  const ref = useRef(null);
  const isInView = useInView(ref, { amount: 0.1, once: true });
  return (
    <p ref={ref} style={{ display:"flex", flexWrap:"wrap", justifyContent:"center", rowGap:"0.1em" }} className={className}>
      {text.split(" ").map((word, i) => (
        <motion.span key={i}
          initial={{ filter:"blur(10px)", opacity:0, y:50 }}
          animate={isInView ? { filter:["blur(10px)","blur(5px)","blur(0px)"], opacity:[0,0.5,1], y:[50,-5,0] } : {}}
          transition={{ duration:0.7, times:[0,0.5,1], ease:"easeOut", delay:(i*100)/1000 }}
          style={{ display:"inline-block", marginRight:"0.28em" }}>
          {word}
        </motion.span>
      ))}
    </p>
  );
}

/* ── FadeUp helper ───────────────────────────────────────────────────────── */
function FadeUp({ children, delay=0, className="", style={} }) {
  const ref = useRef(null);
  const isInView = useInView(ref, { amount: 0.15, once: true });
  return (
    <motion.div ref={ref} className={className} style={style}
      initial={{ opacity:0, y:30, filter:"blur(6px)" }}
      animate={isInView ? { opacity:1, y:0, filter:"blur(0px)" } : {}}
      transition={{ duration:0.7, ease:"easeOut", delay }}>
      {children}
    </motion.div>
  );
}

          </div>
          <p style={{ fontFamily:"'Barlow',sans-serif", fontSize:13, color:"rgba(255,255,255,0.45)", lineHeight:1.75, fontWeight:300, maxWidth:"28ch" }}>
            Haute parfumerie founded in Paris, 1923. Crafted with obsession. Worn with intention.
          </p>
          <div style={{ display:"flex", gap:10, marginTop:24 }}>
            {["IG","TW","FB","PT"].map((s,i) => (
              <div key={i} className="liquid-glass" style={{ width:34, height:34, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer" }}>
                <span style={{ fontFamily:"'Barlow',sans-serif", fontSize:10, color:"rgba(255,255,255,0.7)", fontWeight:500 }}>{s}</span>
              </div>
            ))}
          </div>
          <div style={{ marginTop:28 }}>
            <p style={{ fontFamily:"'Barlow',sans-serif", fontSize:11, color:"rgba(255,255,255,0.4)", letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:8 }}>Correspondence</p>
            <p style={{ fontFamily:"'Barlow',sans-serif", fontSize:12, color:"rgba(255,255,255,0.55)", marginBottom:12, fontWeight:300, lineHeight:1.6, maxWidth:"34ch" }}>
              Private previews and seasonal releases, sent twice a year.
            </p>
            <div className="flex gap-2" style={{ maxWidth:340 }}>
              <input type="email" className="news-input" placeholder="Your email address" aria-label="Your email address" />
              <button aria-label="Subscribe" className="liquid-glass-strong" style={{ borderRadius:9999, padding:"0 15px", border:"none", cursor:"pointer", color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                <ArrowUpRight />
              </button>
            </div>
          </div>
        </div>

        {cols.map((col, i) => (
          <div key={i}>
            <p style={{ fontFamily:"'Barlow',sans-serif", fontSize:11, color:"rgba(255,255,255,0.4)", letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:20 }}>{col.heading}</p>
            {col.links.map((link, j) => (
              <p key={j} style={{ fontFamily:"'Barlow',sans-serif", fontSize:13, color:"rgba(255,255,255,0.65)", marginBottom:10, cursor:"pointer", fontWeight:300, lineHeight:1.4 }}
                onMouseEnter={e => e.target.style.color="#fff"} onMouseLeave={e => e.target.style.color="rgba(255,255,255,0.65)"}>
                {link}
              </p>
            ))}
          </div>
        ))}
      </div>

      <FadeUp>
        <div style={{ paddingTop:36, borderTop:"1px solid rgba(255,255,255,0.08)", marginBottom:40 }}>
          <p style={{ fontFamily:"'Barlow',sans-serif", fontSize:11, color:"rgba(255,255,255,0.4)", letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:20 }}>Boutiques</p>
          <div className="flex flex-wrap gap-x-10 gap-y-5">
            {[
              { city:"Paris", detail:"14 Rue Saint-Honoré · Mon–Sat 10–19" },
              { city:"London", detail:"Mount Street, Mayfair · Mon–Sat 10–18" },
              { city:"New York", detail:"Madison Avenue · Mon–Sat 10–19" },
              { city:"Tokyo", detail:"Ginza Six, Chuo-ku · Daily 11–20" },
            ].map(b => (
              <div key={b.city} style={{ minWidth:220 }}>
                <p style={{ fontFamily:"'Instrument Serif',serif", fontStyle:"italic", fontSize:"1.2rem", color:"#fff", letterSpacing:"-0.4px", marginBottom:4 }}>{b.city}</p>
                <p style={{ fontFamily:"'Barlow',sans-serif", fontSize:12, color:"rgba(255,255,255,0.45)", fontWeight:300, lineHeight:1.5 }}>{b.detail}</p>
              </div>
            ))}
          </div>
        </div>
      </FadeUp>

      <div className="flex flex-wrap items-center justify-between gap-4" style={{ borderTop:"1px solid rgba(255,255,255,0.06)", paddingTop:32 }}>
        <p style={{ fontFamily:"'Barlow',sans-serif", fontSize:12, color:"rgba(255,255,255,0.3)", fontWeight:300 }}>© 2025 Maison AEON. All rights reserved. Paris · London · New York · Tokyo.</p>
        <div className="flex flex-wrap gap-x-6 gap-y-2">
          {["Privacy Policy","Terms of Use","Cookie Preferences"].map((l,i) => (
            <span key={i} style={{ fontFamily:"'Barlow',sans-serif", fontSize:12, color:"rgba(255,255,255,0.3)", cursor:"pointer" }}>{l}</span>
          ))}
        </div>
      </div>
    </footer>
  );
}

/* ── App ─────────────────────────────────────────────────────────────────── */
function App() {
  useEffect(() => {
    const orig = console.error;
    console.error = (...args) => {
      if (typeof args[0] === "string" && args[0].includes("Each child in a list")) return;
      orig(...args);
    };
    return () => { console.error = orig; };
  }, []);

  return (
    <div style={{ background:"#000" }}>
      <HeroSection />
      <MarqueeStrip />
      <CollectionSection />
      <AtelierSection />
      <RitualSection />
      <TestimonialsSection />
      <FAQSection />
      <CTABanner />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
